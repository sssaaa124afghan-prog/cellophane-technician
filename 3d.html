<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تغيير المقاس خطوة بخطوة 3D — فني ماكينة السلوفان</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#007aff;--label:#000;--label-2:rgba(60,60,67,.62);--bg:#f2f2f7;--card:#fff;--fill:rgba(120,120,128,.12);--sep:rgba(60,60,67,.22);
  --font:"SF Arabic",-apple-system,"IBM Plex Sans Arabic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--blue:#0a84ff;--label:#fff;--label-2:rgba(235,235,245,.62);--bg:#000;--card:#1c1c1e;--fill:rgba(120,120,128,.24);--sep:rgba(84,84,88,.6)}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--label);display:flex;flex-direction:column;line-height:1.6;-webkit-tap-highlight-color:transparent}
header{padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{font-size:20px;font-weight:700}
header a{color:var(--blue);text-decoration:none;font-weight:600;font-size:15px;min-height:44px;display:flex;align-items:center}
#stage{position:relative;flex:1;min-height:260px;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.tag{position:absolute;transform:translate(-50%,-120%);background:#ffcc00;color:#000;font-size:13px;font-weight:700;border-radius:8px;padding:2px 9px;white-space:nowrap;pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.tag::after{content:"";position:absolute;inset-inline-start:50%;bottom:-5px;margin-inline-start:-5px;border:5px solid transparent;border-top-color:#ffcc00;border-bottom:0}
#panel{background:var(--card);border-radius:16px 16px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -1px 0 var(--sep)}
#panel{max-height:46vh;display:flex;flex-direction:column}
#cap{overflow:auto;flex:1;min-height:92px}
#cap b{display:block;font-size:18px;font-weight:600;margin:2px 0 4px}
#cap ol{padding-inline-start:20px;font-size:15px;color:var(--label)}
#cap li{margin-bottom:4px}
#cap small{font-size:12px;color:var(--label-2)}
#cap em{font-style:normal;font-weight:700;color:var(--blue)}
select{font:inherit;font-size:15px;width:100%;min-height:40px;border:0;border-radius:10px;background:var(--fill);color:var(--label);padding:6px 10px;margin-top:8px}
input[type=range]{width:100%;margin:10px 0;accent-color:var(--blue);direction:ltr;min-height:28px}
.row{display:flex;gap:10px}
button{flex:1;font:inherit;font-size:16px;font-weight:600;min-height:44px;border:0;border-radius:12px;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);cursor:pointer}
button.main{background:var(--blue);color:#fff}
button:active{opacity:.7}
button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px}
header .hb{display:flex;gap:14px;align-items:center}
header button{flex:none;min-height:36px;padding:4px 14px;font-size:15px;border-radius:10px}
#menu{position:fixed;inset:calc(env(safe-area-inset-top,0px) + 58px) 0 0 0;background:var(--bg);overflow:auto;z-index:5;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px))}
#menu[hidden]{display:none}
#menu .in{max-width:640px;margin:0 auto}
#menu h2{font-size:13px;font-weight:500;color:var(--label-2);padding:16px 12px 6px}
#menu .grp{background:var(--card);border-radius:12px;overflow:hidden}
#menu .grp button{display:flex;width:100%;gap:12px;align-items:center;text-align:start;background:transparent;color:var(--label);font-weight:500;font-size:17px;
  min-height:52px;padding:8px 14px;border-radius:0;border-top:.5px solid var(--sep)}
#menu .grp button:first-child{border-top:0}
#menu .grp i{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
#menu .grp span{flex:1}
#menu .grp button::after{content:"‹";color:var(--label-2);font-size:22px;opacity:.5}
#nogl{padding:24px;text-align:center;color:var(--label-2)}
</style>
</head>
<body>
<header><h1 id="ttl">تغيير المقاس 3D</h1><div class="hb"><button id="mbtn">كل المراحل</button><a href="./">‹ كارت الظبط</a></div></header>
<div id="menu"><div class="in"></div></div>
<div id="stage"></div>
<div id="panel">
  <div id="cap"><small></small><b></b><ol></ol></div>
  <input id="sl" type="range" min="0" max="20" step="0.01" value="0" aria-label="مرحلة الحركة">
  <div class="row"><button id="prev">السابقة</button><button id="play" class="main">عيد الحركة</button><button id="next">التالية</button></div>
</div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
import {OrbitControls} from './vendor/OrbitControls.js';

const q=new URLSearchParams(location.search), n=(k,d)=>{const v=parseFloat(q.get(k));return v>0?v:d};
const L=n('l',245), W=n('w',135), H=n('h',75), OV=15, TAIL=(H+OV)/2, E=(H+15)/2, FW=L+2*E, CUT=2*(W+H)+OV;
let C={tempStart:125,filmType:'acrylic',thick:20,hostSpeed:18,feedSpeed:200,pusherSpeed:50,feedShare:.66,air:.6,air2:.3,startSpeed:12};
try{const r=JSON.parse(localStorage.getItem('cello_tech_v6')||'null');if(r&&r.cfg)C=Object.assign(C,r.cfg)}catch(e){}
const TB=C.tempStart+(C.filmType==='coex'?15:0)+Math.round(3*(C.thick-25)/5), FEED=Math.max(C.feedSpeed,Math.ceil(CUT/(C.feedShare*60/C.hostSpeed)/10)*10);
const stage=document.getElementById('stage');
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true})}catch(e){stage.innerHTML='<p id="nogl">المتصفح ده مش بيدعم العرض ثلاثي الأبعاد. ارجع لكارت الظبط.</p>';throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.appendChild(renderer.domElement);
const dark=matchMedia('(prefers-color-scheme:dark)').matches;
const scene=new THREE.Scene();scene.background=new THREE.Color(dark?0x000000:0xf2f2f7);
const cam=new THREE.PerspectiveCamera(38,1,10,6000);cam.position.set(640,470,-600);
const ctl=new OrbitControls(cam,renderer.domElement);ctl.target.set(0,H/2+60,90);ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI*0.52;ctl.minDistance=300;ctl.maxDistance=1800;
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8a95,1.5));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-300,700,-400);scene.add(sun);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.55,metalness:.1},o));
const steel=M(0xd4d7dc,{metalness:.25,roughness:.45}), alu=M(0xeef0f3,{metalness:.15,roughness:.4,transparent:true,opacity:.5}),
  brass=M(0xd1a93c,{metalness:.3,roughness:.4}), black=M(0x1c1c1f,{roughness:.8}), orange=M(0xff6a1a), pink=M(0xf3b4c6,{roughness:.7}),
  gold=M(0xd4a017,{metalness:.6,roughness:.4}), dk=M(0x3a3d44,{metalness:.4}),
  film=new THREE.MeshPhysicalMaterial({color:0xcfe8ff,transparent:true,opacity:.34,roughness:.05,side:THREE.DoubleSide,depthWrite:false});
const box=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
const add=(o,x=0,y=0,z=0,p=scene)=>{o.position.set(x,y,z);p.add(o);return o};

/* ---- الماكينة الثابتة ---- */
add(box(L+420,16,330,steel),0,-8,-170);            // الطاولة قبل فتحة الفيلم
add(box(L+420,16,205,steel),0,-8,W/2+10+95-W/2);  // الطاولة بعد الفتحة
const guides=[-1,1].map(s=>{const g=add(box(4,26,330,steel),0,13,-172);g.userData.s=s;return g});
const mkMold=(m,k)=>{const g=add(new THREE.Group());for(const s of[-1,1])add(box(3,H+6,W,m),s*(L/2+2.5)*k,(H+6)/2,W/2,g);add(box((L+5)*k,3,W,m),0,H+4,W/2,g);
  for(const s of[-1,1])add(new THREE.Mesh(new THREE.CylinderGeometry(4,4,6,6),black),s*(L/2-20)*k,H+8,W/2,g);return g};
const mold=mkMold(alu,1), moldOld=mkMold(M(0x9aa0a8,{transparent:true,opacity:.75}),1.14);
const brush=add(new THREE.Group(),0,0,-78);
add(box(L+30,6,52,steel),0,13,0,brush);add(box(L,10,44,M(0x2a2a2e,{roughness:1})),0,5,0,brush);
for(const s of[-1,1])add(new THREE.Mesh(new THREE.CylinderGeometry(4,4,150,10),steel),s*(L/2+26),75,-78);
const PX=-(L/2+215),PZ=-430;
add(new THREE.Mesh(new THREE.CylinderGeometry(9,9,250,12),steel),PX,125,PZ);
const pan=add(new THREE.Group(),PX,265,PZ);pan.rotation.y=.55;
add(box(150,130,26,M(0xe6e7ea)),0,0,0,pan);add(box(110,62,3,M(0x1557d6,{emissive:0x1557d6,emissiveIntensity:.5})),0,26,-14,pan);
const estop=add(new THREE.Mesh(new THREE.CylinderGeometry(11,11,12,20),M(0xe3221c,{emissive:0xff0000,emissiveIntensity:0})),-48,-36,-18,pan);estop.rotation.x=Math.PI/2;
add(new THREE.Mesh(new THREE.CylinderGeometry(8,8,8,20),M(0x1faa55)),-12,-36,-16,pan).rotation.x=Math.PI/2;
for(let i=0;i<3;i++)add(box(22,22,3,black),14+i*26,-36,-14,pan);
const RX=L/2+150,RZ=120;
for(const[i,r]of[[0,16],[1,11]]){add(new THREE.Mesh(new THREE.CylinderGeometry(r,r,70-i*14,16),M(0xf2f2f2)),RX+i*52,40,RZ);
  add(new THREE.Mesh(new THREE.CylinderGeometry(r+2,r+2,5,24),M(0xffffff)),RX+i*52,44,RZ-r-3).rotation.x=Math.PI/2}
// عمود الارتفاع بالمسطرة
const colX=-(L/2+130);
add(new THREE.Mesh(new THREE.CylinderGeometry(13,13,360,24),steel),colX,180,-16);
add(box(2,340,14,M(0xf5f5f0)),colX+13.5,180,-16);
for(let i=0;i<17;i++)add(box(2.4,1.2,i%5?7:13,black),colX+14,20+i*20,-16);
const car=add(new THREE.Group());                                   // العربة اللي بتتحرك على العمود
add(box(60,44,60,dk),colX,0,-16,car);
const lev=add(box(8,46,10,orange),colX-34,-6,-40,car);lev.rotation.x=.35;
add(box(Math.abs(colX)+L/2+40,10,12,dk),(colX+L/2+40)/2-20,0,-16,car); // الذراع
const sealer=add(box(L+50,18,16,brass.clone()),0,-16,-10,car);     // سخان اللحام الطولي
add(new THREE.Mesh(new THREE.CylinderGeometry(9,9,14,6),black),0,14,-16,car);
// لوح الطي السفلي
const fold=add(box(L+30,TAIL+30,3,steel),0,0,-5);
// الدافع
const push=add(new THREE.Group());
add(box(L-30,H-14,8,steel),0,H/2,0,push);
const rod=add(new THREE.Mesh(new THREE.CylinderGeometry(7,7,260,16),steel),0,H/2,-134,push);rod.rotation.x=Math.PI/2;
add(box(46,46,120,M(0xe9eaec,{metalness:.5})),0,H/2,-330);          // السلندر
// رول السلوفان والشريط الدهبي
const roll=add(new THREE.Mesh(new THREE.CylinderGeometry(58,58,FW,40),new THREE.MeshPhysicalMaterial({color:0xe8f3ff,roughness:.15,transparent:true,opacity:.9})),0,H+TAIL+W+130,-70);roll.rotation.z=Math.PI/2;
add(new THREE.Mesh(new THREE.CylinderGeometry(20,20,FW+70,20),dk),0,H+TAIL+W+130,-70).rotation.z=Math.PI/2;
add(new THREE.Mesh(new THREE.CylinderGeometry(8,8,FW+40,16),steel),0,H+TAIL+W+14,-6).rotation.z=Math.PI/2; // بكرة توجيه
add(box(FW+30,10,14,dk),0,H+TAIL+W+2,10);                           // السكينة
const tapeX=-(L/2)+20;
add(new THREE.Mesh(new THREE.CylinderGeometry(26,26,5,24),gold),tapeX,H+TAIL+W+70,-150).rotation.z=Math.PI/2;
// سير الخروج وسخانات الجوانب
const EX=W+60;                                                      // بداية الخروج
add(box(L+70,14,330,black),0,-9,EX+165);
for(let i=0;i<13;i++)add(box(4,4,330,M(0x2c2c30)),-(L/2+20)+i*((L+40)/12),-1,EX+165);
const heat=[-1,1].map(s=>{const g=add(new THREE.Group());
  add(box(22,H+8,W+10,M(0x222226,{emissive:0xff3b00,emissiveIntensity:0})),0,(H+8)/2,0,g);
  add(box(6,H+60,6,steel),s*8,(H+60)/2,W/2+14,g);
  const l=add(box(40,8,10,orange),s*18,H+62,W/2+14,g);l.rotation.y=s*.5;
  g.userData.s=s;return g});
add(box(L+260,5,22,steel),0,H+58,EX+150+W/2+14);                    // القضيب المشقوق

/* ---- البوكس والسلوفان ---- */
const B=add(box(L,H,W,pink),0,H/2,0);
add(box(L*.5,.6,W*.62,M(0xc9a23a,{metalness:.7})),0,H/2+.2,0,B);    // طبعة دهبي على الوش
const G=add(new THREE.Group());                                     // كل السلوفان
const plane=(w,h)=>new THREE.Mesh(new THREE.PlaneGeometry(w,h),film);
const fFront=add(plane(1,H),0,H/2,0,G);
const fTop=add(plane(1,1),0,H+.8,0,G);fTop.rotation.x=-Math.PI/2;
const fBot=add(plane(1,1),0,.8,0,G);fBot.rotation.x=-Math.PI/2;
const hUp=add(new THREE.Group(),0,H,-.8,G), tUp=add(plane(1,1),0,0,0,hUp);
const hDn=add(new THREE.Group(),0,0,-1.6,G), tDn=add(plane(1,1),0,0,0,hDn);
const tapeM=M(0xd4a017,{metalness:.5,transparent:true,opacity:.95,side:THREE.DoubleSide});
const tp=[add(new THREE.Mesh(new THREE.PlaneGeometry(3,H),tapeM),tapeX,H/2,.6,G),
          add(new THREE.Mesh(new THREE.PlaneGeometry(3,1),tapeM),tapeX,H+1.4,0,G)];tp[1].rotation.x=-Math.PI/2;
// طيات الأطراف: 4 لكل جنب
const flaps=[];
for(const s of[-1,1]){const x=s*L/2;
  const mk=(w,h,px,py,pz,ox,oy,oz,ax,sign,rx)=>{const hg=add(new THREE.Group(),px,py,pz,G),m=add(plane(w,h),ox,oy,oz,hg);if(rx)m.rotation.x=-Math.PI/2;flaps.push({hg,ax,sign});return hg};
  mk(E,H,x,H/2,W, s*E/2,0,0,'y', s,0).userData.k='tuck';            // أمامي
  mk(E,H,x,H/2,0, s*E/2,0,0,'y',-s,0).userData.k='tuck';            // خلفي
  mk(E,W,x+s*1,0,W/2, s*E/2,0,0,'z', s,1).userData.k='bot';         // سفلي
  mk(E,W,x+s*2,H,W/2, s*E/2,0,0,'z',-s,1).userData.k='top';         // علوي
}
/* ---- الخطوات ---- */
const mm=x=>'<em dir="ltr">'+(Math.round(x*10)/10)+'</em> مم', em=x=>'<em dir="ltr">'+x+'</em>';
const STEPS=[
 ['الأمان أولًا',['دوس Stop على الشاشة وحوّل لـ Manual Mode.','دوس زرار الطوارئ الأحمر قبل ما تمد إيدك جوه الماكينة.','السخانات بتفضل سخنة: استنى تبرد أو البس جوانتي حراري.','جهّز جنبك: القالب الجديد، الرول، مفتاح الأعمدة المربعة، كارت القالب، و5 بوكسات.']],
 ['فك القالب القديم',['فك مسامير تثبيت القالب.','ارفعه لفوق باستقامة وحطه على الرف في مكانه.','نضّف مكان القالب من بواقي السلوفان واللزق.']],
 ['ركّب القالب الجديد',['اتأكد إن الرقم المحفور عليه هو مقاس البوكس: '+em(L+'*'+W+'*'+H)+'.','نزّله في مكانه واربط المسامير.','جرّب بوكس بإيدك: يدخل ويطلع من غير زنقة ومن غير لعب.']],
 ['دلائل السير',['فك الذراع البرتقالي.','حط بوكس بين الدليلين وقرّبهم لحد ما يفضل 1 إلى 1.5 مم من كل جنب.','المسافة الداخلية بين الدليلين = '+mm(L+2.5)+'.','اقفل الذراع وحرّك البوكس بإيدك: لازم يمشي حر.']],
 ['الضاغط (الفرشة)',['حط بوكس تحت الفرشة.','نزّلها لحد ما الشعر يضغط البوكس 2 مم. ارتفاع الفرشة = '+mm(H-2)+'.','البوكس يتحرك تحتها بمقاومة خفيفة. لو بيتعلّم ارفعها مم.']],
 ['رول السلوفان والشريط الدهبي',['عرض الرول المطلوب '+mm(FW)+' (المسموح من '+em(L+H+8)+' لحد '+em(Math.round(L+1.5*H))+').','ركّبه على المحور ووسّطه: الزيادة عن البوكس '+mm(E)+' من كل جنب.','عدّي الفيلم على البكر زي الرسمة الملزوقة على الماكينة.','الشريط الدهبي على بعد '+mm(E+20)+' من حرف الرول.']],
 ['شدة الرول',['اسحب الفيلم بإيدك: المقاومة تبقى خفيفة وثابتة.','مشدود قوي = الطول يطلع ناقص والشريط الدهبي يكرمش.','مرخي = الفيلم يرفرف ويتكرمش قبل ما يوصل للبوكس.','عدّل فرامل المحور شوية بشوية.']],
 ['ارتفاع وحدة الطي واللحام',['فك الذراعين البرتقالي اللي على العمود.','لف العمود المربع بالمفتاح لحد ما الفتحة = '+mm(H+4)+'، يعني 1.5 إلى 3 مم فوق وتحت البوكس.','اقفل الذراعين.','اكتب قراءة المسطرة على كارت القالب عشان المرة الجاية.']],
 ['وقفة الدافع ولوح الطي',['من شاشة Manual شغّل الدافع مرة واحدة.','لازم يقف قبل لوح الطي السفلي بـ 1 إلى 2 مم.','مشكّل الأركان على نفس مستوى لوح الطي، وبينهم 1 إلى 2 مم.']],
 ['سخانات الجوانب',['فك الذراعين البرتقالي اللي على القضيب المشقوق.','حط بوكس بين السخانين وقرّبهم لحد ما يلمسوه. المسافة بينهم = '+mm(L)+'.','اقفل الذراعين. البوكس يعدّي بينهم بلمس خفيف.']],
 ['الهوا',['المنظم الكبير (الرئيسي): '+em(C.air)+' MPa.','المنظم الصغير (اللحام): '+em(C.air2)+' MPa.','لو الرئيسي نزل عن 0.5 الماكينة تدي إنذار Low air pressure.']],
 ['الحرارة',['Long side sealing: '+em(TB)+' درجة.','Left وRight spot sealing: '+em(TB+10)+' درجة.','Hot sealing (Iron): '+em(TB-5)+' درجة.','استنى الحرارة الفعلية PV توصل للمطلوبة SV، وبعدها دقيقتين.','دي أرقام بداية. التعديل 5 درجات في المرة.']],
 ['أرقام الشاشة (Auto)',['Film length = '+em(CUT)+'.','Film feeding speed = '+em(FEED)+'.','Host speed = '+em(C.startSpeed)+' لأول تجربة.','Front side pusher speed = '+em(C.pusherSpeed)+'.','الزوايا في Parameter ← Angle ماتتلمسش.']],
 ['تجربة: البوكس بين الدلائل',['فك زرار الطوارئ وحط بوكس واحد.','دوس Single Cycle عشان الماكينة تلف بوكس واحد بس.','راقب كل حركة من الخطوات الجاية.']],
 ['الدافع بيدخّل البوكس في السلوفان',['البوكس بياخد السلوفان معاه ويدخل القالب.','الفيلم بيلف على الوش والضهر.','لو الفيلم اتأخر أو سبق البوكس: ده توقيت، مش ظبط مقاس.']],
 ['لوح الطي السفلي بيطلع',['بيطوي طرف الفيلم السفلي على جنب البوكس.','لو اللوح بعيد الفيلم يطلع مرخي، ولو لازق البوكس يتخدش.']],
 ['السخان الطولي بينزل ويلحم',['بيطوي الطرف العلوي فوق السفلي ويلحمهم.','التراكب بينهم '+mm(OV)+'.']],
 ['طي الأطراف',['الطرفين الجانبيين بيتطووا الأول.','بعدهم الطرف السفلي، وبعده العلوي.','لو الأركان مش مربعة راجع خطوة ارتفاع وحدة الطي.']],
 ['الخروج بين سخانات الجوانب',['البوكس بيطلع على السير بين السخانين.','السخانين بيلحموا الطرفين.']],
 ['افحص أول 3 بوكسات',['التراكب على اللحام الطولي = '+mm(OV)+'. لو أقل أو أكتر عدّل Film length بالفرق.','الأطراف مقفولة وملحومة من غير ديل زيادة.','مفيش كرمشة على الوش، والشريط الدهبي في مكانه.','كله تمام؟ ارفع السرعة 15 وبعدها 18، واحفظ الظبطة «مؤكدة» واطبع كارت القالب.','فيه عيب؟ افتح «العيوب» في البرنامج.']]
];
const NS=STEPS.length, W0=13;
const tags=[];
const tag=(txt,v,a,b)=>{const el=document.createElement('div');el.className='tag';el.innerHTML=txt.replace(/<\/?em[^>]*>/g,m=>m.startsWith('</')?'</bdi>':'<bdi dir="ltr">');stage.appendChild(el);tags.push({el,v,a,b:b??a+1})};
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
tag('زرار الطوارئ',V(PX+30,250,PZ-30),0);
tag('القالب القديم',V(0,H+150,W/2),1);
tag('القالب '+L+'*'+W+'*'+H,V(0,H+30,W/2),2);
tag('الدلائل '+mm(L+2.5),V(L/2+6,30,-230),3);
tag('الفرشة '+mm(H-2),V(0,H+25,-78),4);
tag('عرض الرول '+mm(FW),V(0,H+TAIL+W+195,-70),5);
tag('الشريط '+mm(E+20)+' من الحرف',V(-(L/2)+20,H+TAIL+W+100,-150),5);
tag('فرامل المحور',V(FW/2+30,H+TAIL+W+130,-70),6);
tag('الفتحة '+mm(H+4),V(colX,H+70,-16),7);
tag('يقف قبل اللوح 1 إلى 2 مم',V(0,12,-10),8);
tag('المسافة = '+mm(L),V(0,H+75,EX+150),9);
tag('رئيسي '+C.air+' · لحام '+C.air2+' MPa',V(RX+26,95,RZ),10);
tag('Long side '+TB+'°',V(0,H+TAIL+85,-10),11);
tag('Spot '+(TB+10)+'° · Iron '+(TB-5)+'°',V(0,H+40,EX+150),11);
tag('Film length '+CUT+' · Feed '+FEED,V(PX,345,PZ),12);
tag('Film length '+mm(CUT),V(0,H+TAIL+W-10,0),W0+.2,W0+1.2);
tag('لوح الطي: يبعد 1.5 إلى 3 مم',V(L/2+10,10,-8),W0+2);
tag('تراكب اللحام '+mm(OV),V(0,H/2,-12),W0+3);
tag('طرف السلوفان '+mm(E),V(L/2+E,H,W/2),W0+4);
tag('افحص: تراكب '+OV+' · أطراف مقفولة · من غير كرمشة',V(0,H+60,EX+150),W0+6);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), ph=(t,a,b)=>{const x=cl((t-a)/(b-a));return x*x*(3-2*x)};
let T=0; const P=k=>ph(T,k+.1,k+.8);
const CAM={ov:[[640,470,-600],[0,H/2+60,90]],mold:[[430,340,-260],[0,H,W/2]],guide:[[360,300,-560],[0,20,-170]],brush:[[380,260,-380],[0,H,-78]],
 roll:[[560,600,-480],[0,H+TAIL+W+90,-60]],col:[[-600,360,-250],[colX+60,H+50,-16]],fold:[[420,220,-330],[0,H/2,0]],heat:[[430,330,EX+560],[0,H/2,EX+150]],
 air:[[RX+330,230,RZ-260],[RX+26,40,RZ]],pan:[[PX+230,330,PZ-330],[PX,250,PZ]]};
const CAMOF=['pan','mold','mold','guide','brush','roll','roll','col','fold','heat','air','ov','pan','ov','ov','fold','fold','ov','heat','heat'];
const cap=document.getElementById('cap'),sl=document.getElementById('sl'),menu=document.getElementById('menu');
const GR=[['تبديل القالب',0,2],['ظبط المسافات والسلوفان',3,9],['الهوا والحرارة والشاشة',10,12],['التجربة: بوكس واحد',13,18],['الفحص',19,19]];
const grOf=i=>GR.find(g=>i>=g[1]&&i<=g[2])[0];
menu.firstElementChild.innerHTML=GR.map(g=>`<h2>${g[0]}</h2><div class="grp">`+STEPS.slice(g[1],g[2]+1).map((x,k)=>`<button data-i="${g[1]+k}"><i>${g[1]+k+1}</i><span>${x[0]}</span></button>`).join('')+'</div>').join('');
let lastCap=-1,camGoal=null,camAnim=0;
ctl.addEventListener('start',()=>camAnim=0);
function apply(){
  const t=cl(T-W0,0,6);
  const p1=ph(t,0,1),f1=ph(t,1.1,1.9),f2=ph(t,2.1,2.9),e1=ph(t,3.05,3.4),e2=ph(t,3.4,3.7),e3=ph(t,3.7,3.98),out=ph(t,4.1,4.95),hc=ph(t,5.1,5.8);
  const F=-150+(W+150)*p1, c=cl(F,0,W), dz=out*(EX+150-W/2), split=t>=3.02;
  B.position.set(0,H/2,F-W/2+dz);
  G.position.z=dz;
  const wd=split?L:FW, tl=TAIL+W-c;
  fFront.visible=fTop.visible=fBot.visible=F>=0;
  fFront.position.z=Math.max(F,0);fFront.scale.set(wd,1,1);
  fTop.scale.set(wd,Math.max(c,.01),1);fTop.position.z=c/2;
  fBot.scale.set(wd,Math.max(c,.01),1);fBot.position.z=c/2;
  tUp.scale.set(wd,tl,1);tUp.position.y=tl/2;hUp.rotation.x=-Math.PI*f2;
  tDn.scale.set(wd,tl,1);tDn.position.y=-tl/2;hDn.rotation.x=Math.PI*f1;
  tp[0].visible=tp[1].visible=F>=0;tp[0].position.z=Math.max(F,0)+.6;tp[1].scale.y=Math.max(c,.01);tp[1].position.z=c/2;
  for(const f of flaps){f.hg.visible=split;const k=f.hg.userData.k,v=k==='tuck'?e1:k==='bot'?e2:e3;f.hg.rotation[f.ax]=f.sign*Math.PI/2*v}
  push.position.z=Math.min(F-W-6,-8)-( t>1?ph(t,1,1.6)*160:0);
  fold.position.y=-(TAIL+30)/2-14+(TAIL+14)*f1*(1-out);
  const sy=H+TAIL+60-(H+TAIL+60-(H-TAIL+OV/2+9))*f2*(1-out);
  car.position.y=sy;sealer.material.emissive.setHex(0xff3b00);sealer.material.emissiveIntensity=.9*ph(t,2.6,2.9)*(1-out);
  for(const g of heat){const s=g.userData.s;g.position.set(s*(L/2+11+60*(1-P(9))),0,EX+150);g.children[0].material.emissiveIntensity=Math.max(.3*P(11),1.1*ph(t,5.3,5.95))}
  estop.material.emissiveIntensity=T<1?.5+.5*Math.sin(performance.now()/180):0;
  moldOld.visible=T<2;moldOld.position.y=260*P(1);
  mold.visible=T>=2;mold.position.y=260*(1-P(2));
  for(const g of guides)g.position.x=g.userData.s*(L/2+3.25+34*(1-P(3)));
  brush.position.y=H-2+48*(1-P(4));
  roll.visible=T>=5;roll.position.x=FW*.9*(1-P(5));G.visible=T>=5.9;
  car.position.y+=90*(1-P(7));lev.rotation.x=.35-.6*P(7);
  if(T>=8&&T<9)fold.position.y+=(TAIL+14)*Math.sin(Math.PI*P(8))*.8;
  sealer.material.emissiveIntensity=Math.max(sealer.material.emissiveIntensity,.3*P(11));
  B.visible=T<1||T>=2.75;
  const i=Math.min(NS-1,Math.floor(T));
  if(i!==lastCap){lastCap=i;cap.children[0].textContent='المرحلة '+(i+1)+' من '+NS+' · '+grOf(i);cap.children[1].textContent=STEPS[i][0];
    cap.children[2].innerHTML=STEPS[i][1].map(x=>'<li>'+x+'</li>').join('');cap.scrollTop=0;
    const c=CAM[CAMOF[i]];const tg=new THREE.Vector3(...c[1]),ps=new THREE.Vector3(...c[0]);if(cam.aspect<1)ps.sub(tg).multiplyScalar(1.45).add(tg);camGoal=[ps,tg];camAnim=70}
}
const v=new THREE.Vector3();
function frame(){
  if(playing){T=Math.min(target,T+.011);sl.value=T;if(T>=target)playing=false}
  apply();
  if(camAnim>0&&camGoal){cam.position.lerp(camGoal[0],.07);ctl.target.lerp(camGoal[1],.07);camAnim--}
  ctl.update();renderer.render(scene,cam);
  const w=stage.clientWidth,h=stage.clientHeight;
  for(const g of tags){const on=T>=g.a&&T<g.b+.001;v.copy(g.v).project(cam);
    g.el.style.display=on&&v.z<1?'block':'none';g.el.style.left=(v.x*.5+.5)*w+'px';g.el.style.top=(-v.y*.5+.5)*h+'px'}
}
function size(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?52:38;cam.updateProjectionMatrix()}
new ResizeObserver(size).observe(stage);size();
let playing=false,target=0,cur=0;const btn=document.getElementById('play');
function openStep(i,keep){cur=Math.max(0,Math.min(NS-1,i));sl.min=cur;sl.max=cur+.999;T=cur;sl.value=cur;target=cur+.999;playing=true;menu.hidden=true;
  if(!keep)try{history.replaceState(null,'','#s'+(cur+1))}catch(e){}}
btn.onclick=()=>openStep(cur,true);
document.getElementById('next').onclick=()=>{if(cur<NS-1)openStep(cur+1);else{playing=false;menu.hidden=false}};
document.getElementById('prev').onclick=()=>{if(cur>0)openStep(cur-1)};
sl.oninput=()=>{playing=false;T=+sl.value};
document.getElementById('mbtn').onclick=()=>{playing=false;menu.hidden=!menu.hidden};
menu.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)openStep(+b.dataset.i)});
const fromHash=()=>{const m=/^#s(\d+)$/.exec(location.hash);if(m)openStep(+m[1]-1,true)};
addEventListener('hashchange',fromHash);fromHash();
renderer.setAnimationLoop(frame);
window.__set=x=>{T=x;sl.min=0;sl.max=20;sl.value=x};
</script>
</body>
</html>
